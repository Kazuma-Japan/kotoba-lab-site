site_name: Kotoba Lab — 60-Day Japanese Speaking Challenge
site_description: Go from "I studied Japanese but can't speak it" to having real conversations in 60 days.
site_url: https://kazuma-japan.github.io/kotoba-lab-site/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: pink
      accent: pink
  font:
    text: Noto Sans JP
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/sakura.css

extra_javascript:
  - javascripts/enhance.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Start Guide: start-guide.md
